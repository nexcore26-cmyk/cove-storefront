<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="description" content="%%TENANT_META_DESCRIPTION%%" />
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="512x512" href="%%TENANT_FAVICON%%" />
    <link rel="apple-touch-icon" sizes="512x512" href="%%TENANT_FAVICON%%" />

    <!-- Open Graph / Social Share -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%%TENANT_TITLE%%" />
    <meta property="og:description" content="%%TENANT_META_DESCRIPTION%%" />
    <meta property="og:image" content="%%TENANT_OG_IMAGE%%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="%%TENANT_BUSINESS_NAME%%" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%%TENANT_TITLE%%" />
    <meta name="twitter:description" content="%%TENANT_META_DESCRIPTION%%" />
    <meta name="twitter:image" content="%%TENANT_OG_IMAGE%%" />

    <title>%%TENANT_TITLE%%</title>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    %%TENANT_FONT_LINKS%%
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"
    ></script>
  </body>
</html>
